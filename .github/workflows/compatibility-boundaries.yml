name: COPC adapter boundary compatibility

on:
  schedule:
    - cron: '47 3 * * 0'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: copc-compatibility-boundaries-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COPC_ADAPTER_REPOSITORY: mors119/copc-adapter
  COPC_ADAPTER_REF: main
  COPC_ADAPTER_VERSION: 0.4.0

jobs:
  pack-adapter:
    name: pack adapter artifact
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check out adapter source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.COPC_ADAPTER_REPOSITORY }}
          ref: ${{ env.COPC_ADAPTER_REF }}
          path: .copc-adapter
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install Rust WASM target
        run: rustup target add wasm32-unknown-unknown
      - name: Pack adapter source
        id: pack
        env:
          COPC_ADAPTER_SOURCE: checkout
          COPC_ADAPTER_CHECKOUT: ${{ github.workspace }}/.copc-adapter
          COPC_ADAPTER_PACK_DESTINATION: ${{ runner.temp }}/copc-adapter-pack
        shell: bash
        run: |
          node tools/matrix/package-source.mjs pack
          tarball=$(find "$RUNNER_TEMP/copc-adapter-pack" -maxdepth 1 -name 'frillab-copc-adapter-*.tgz' -print -quit)
          test -n "$tarball"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: packed-adapter
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error

  node-and-peer-boundaries:
    name: Node ${{ matrix.node }} / ${{ matrix.case }}
    needs: pack-adapter
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [18.x, 22.x]
        case:
          [cesium-min, cesium-current, three-min, three-current, r3f-current]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: packed-adapter
          path: adapter-package
      - name: Locate packed adapter
        shell: bash
        run: |
          tarball=$(find "$GITHUB_WORKSPACE/adapter-package" -name '*.tgz' -print -quit)
          test -n "$tarball"
          echo "COPC_ADAPTER_TARBALL=$tarball" >> "$GITHUB_ENV"
      - name: Build clean packed consumer
        run: npm run compatibility:consumer -- --cases ${{ matrix.case }} --package-managers npm

  package-managers:
    name: ${{ matrix.package_manager }} / ${{ matrix.case }}
    needs: pack-adapter
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        package_manager: [npm, pnpm, yarn, bun]
        case: [cesium-min, three-current]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Set up pnpm
        if: matrix.package_manager == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - name: Set up Bun
        if: matrix.package_manager == 'bun'
        uses: oven-sh/setup-bun@v2
      - name: Set up Yarn
        if: matrix.package_manager == 'yarn'
        run: npm install --global yarn@1.22.22
      - uses: actions/download-artifact@v4
        with:
          name: packed-adapter
          path: adapter-package
      - name: Locate packed adapter
        shell: bash
        run: |
          tarball=$(find "$GITHUB_WORKSPACE/adapter-package" -name '*.tgz' -print -quit)
          test -n "$tarball"
          echo "COPC_ADAPTER_TARBALL=$tarball" >> "$GITHUB_ENV"
      - name: Build clean packed consumer
        run: npm run compatibility:consumer -- --cases ${{ matrix.case }} --package-managers ${{ matrix.package_manager }}

  operating-system-smoke:
    name: ${{ matrix.os }} / production build smoke
    needs: pack-adapter
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: packed-adapter
          path: adapter-package
      - name: Locate packed adapter
        shell: bash
        run: |
          tarball=$(find "$GITHUB_WORKSPACE/adapter-package" -name '*.tgz' -print -quit)
          test -n "$tarball"
          echo "COPC_ADAPTER_TARBALL=$tarball" >> "$GITHUB_ENV"
      - name: Build clean packed consumers
        run: npm run compatibility:consumer -- --cases cesium-current,three-current --package-managers npm
