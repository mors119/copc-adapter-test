name: COPC consumer testbed

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 6'
  workflow_dispatch:
    inputs:
      tier:
        description: Validation tier
        required: true
        default: fast
        type: choice
        options: [fast, full]

permissions:
  contents: read

concurrency:
  group: copc-consumer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COPC_ADAPTER_CHECKOUT: ${{ github.workspace }}/.copc-adapter
  COPC_ADAPTER_SOURCE: checkout
  COPC_ADAPTER_VERSION: 0.4.0

jobs:
  fast:
    if: github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.tier == 'fast')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mors119/copc-adapter
          ref: v0.4.0
          path: .copc-adapter
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: rustup target add wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: .cache/copc-fixtures
          key: copc-small-fixture-${{ runner.os }}-${{ hashFiles('fixtures/catalog.json') }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run bootstrap:local
      - run: npm run test:fast
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fast-failure-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  full:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.tier == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COPC_E2E_MODE: full
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mors119/copc-adapter
          ref: v0.4.0
          path: .copc-adapter
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: rustup target add wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: .cache/copc-fixtures
          key: copc-small-fixture-${{ runner.os }}-${{ hashFiles('fixtures/catalog.json') }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run bootstrap:local
      - run: npm run test:full
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-failure-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
