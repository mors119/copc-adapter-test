name: COPC adapter packed release gate

on:
  workflow_dispatch:
    inputs:
      source:
        description: Adapter artifact source
        required: true
        default: checkout
        type: choice
        options: [checkout, tarball, npm]
      adapter-repository:
        description: Repository to pack when source is checkout
        required: true
        default: mors119/copc-adapter
        type: string
      adapter-ref:
        description: Branch, tag, or commit to pack when source is checkout
        required: true
        default: v0.4.0
        type: string
      adapter-tarball-url:
        description: HTTPS URL of a packed 0.4.0 artifact when source is tarball
        required: false
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COPC_ADAPTER_SOURCE: ${{ inputs.source }}
      COPC_ADAPTER_VERSION: 0.4.0
      COPC_ADAPTER_CHECKOUT: ${{ github.workspace }}/.release-adapter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        if: inputs.source == 'checkout'
        with:
          repository: ${{ inputs.adapter-repository }}
          ref: ${{ inputs.adapter-ref }}
          path: .release-adapter
      - name: Download adapter tarball
        if: inputs.source == 'tarball'
        env:
          TARBALL_URL: ${{ inputs.adapter-tarball-url }}
        run: curl --fail --location --retry 3 --output "$RUNNER_TEMP/copc-adapter-0.4.0.tgz" "$TARBALL_URL"
      - name: Set tarball source
        if: inputs.source == 'tarball'
        run: echo "COPC_ADAPTER_TARBALL=$RUNNER_TEMP/copc-adapter-0.4.0.tgz" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: rustup target add wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: .cache/copc-fixtures
          key: copc-small-fixture-${{ runner.os }}-${{ hashFiles('fixtures/catalog.json') }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:release
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-failure-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
